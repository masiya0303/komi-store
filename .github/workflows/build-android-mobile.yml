name: Build Android APK/AAB

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.9.3；留空使用 libs.versions.toml）'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract projectVersionName from gradle/libs.versions.toml
        id: toml
        shell: bash
        run: |
          RAW=$(grep -oP 'projectVersionName\s*=\s*"\K[^"]+' gradle/libs.versions.toml || echo "1.0.0")
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "project version: $RAW"

      - name: Get version
        id: get_version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
          PACKAGE_VERSION: v${{ steps.toml.outputs.raw }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="$TAG_VERSION"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi

          if [ "${VERSION#v}" != "$VERSION" ]; then
            VERSION="v$VERSION"
          fi
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Use v1.2.3 or 1.2.3."
            exit 1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release version '$VERSION' must match libs.versions.toml version '$PACKAGE_VERSION'. Update libs.versions.toml first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Auto-create tag if missing
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists on remote, skipping."
            exit 0
          fi
          echo "Creating and pushing tag $RELEASE_VERSION ..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Check for an existing release
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Release $RELEASE_VERSION already exists; existing notes and assets are preserved."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: komi-store ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-android:
    needs: create-release
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check signing configuration
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Keystore
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > komi-store-release.jks

      - name: Build Signed Release (APK + AAB)
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease \
            -Pandroid.injected.signing.store.file=komi-store-release.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEY_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --stacktrace --no-daemon

      - name: Build Debug (APK + AAB) as fallback
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew :composeApp:assembleDebug :composeApp:bundleDebug --stacktrace --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f komi-store-release.jks

      - name: Collect and rename APK + AAB
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          rm -rf dist
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            APK=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -1)
            AAB=$(find composeApp/build/outputs/bundle/release -name "*.aab" | head -1)
            [ -n "$APK" ] && cp "$APK" "komi-store-${VERSION}-android.apk"
            [ -n "$AAB" ] && cp "$AAB" "komi-store-${VERSION}-android.aab"
          else
            APK=$(find composeApp/build/outputs/apk/debug -name "*.apk" | head -1)
            AAB=$(find composeApp/build/outputs/bundle/debug -name "*.aab" | head -1)
            [ -n "$APK" ] && cp "$APK" "komi-store-${VERSION}-android-debug.apk"
            [ -n "$AAB" ] && cp "$AAB" "komi-store-${VERSION}-android-debug.aab"
          fi
          ls -la komi-store-*.apk komi-store-*.aab 2>&1

      - name: Upload APK + AAB to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          EXISTING_ASSETS=$(gh release view "$VERSION" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          for f in komi-store-*.apk komi-store-*.aab; do
            [ -f "$f" ] || continue
            if echo "$EXISTING_ASSETS" | grep -Fqx "$f"; then
              echo "Skipping existing asset $f"
            else
              echo "Uploading $f to release $VERSION ..."
              gh release upload "$VERSION" "$f" --repo "${{ github.repository }}"
            fi
          done
